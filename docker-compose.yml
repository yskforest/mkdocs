services:
  # 1. 認証とルーティングを担当するWebサーバー (フロントエンド)
  nginx:
    image: nginx:alpine
    container_name: mkdocs_nginx
    ports:
      - "8100:80"  # ユーザーはここへアクセスする
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - mkdocs

  # 2. MkDocs本体 (バックエンド)
  mkdocs:
    build: .
    container_name: mkdocs_dev
    # ports:        # Nginx経由でアクセスするためポートの公開は不要（削除）
    #  - "8000:8000"
    volumes:
      - ./:/docs
    command: serve --dev-addr=0.0.0.0:8000
    depends_on:
      - kroki

  # 3. 図表生成サーバー
  kroki:
    image: yuzutech/kroki:latest
    container_name: kroki_server
    expose:
      - "8000"
    environment:
      - KROKI_PLANTUML_ENABLED=true
