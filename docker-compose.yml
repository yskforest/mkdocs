services:
  nginx:
    image: nginx:alpine
    container_name: mkdocs_nginx
    ports:
      - "8100:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/.htpasswd:ro
    restart: always
    depends_on:
      - mkdocs

  mkdocs:
    build: .
    container_name: mkdocs_dev
    volumes:
      - ./:/docs
    command: serve --dev-addr=0.0.0.0:8000
    restart: always
    depends_on:
      - kroki

  kroki:
    image: yuzutech/kroki:latest
    container_name: kroki_server
    expose:
      - "8000"
    environment:
      - KROKI_PLANTUML_ENABLED=true
    restart: always
