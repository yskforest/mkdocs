services:
  nginx:
    image: nginx:alpine
    container_name: mkdocs_nginx
    ports:
      # - "8100:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/htpasswd:/etc/nginx/.htpasswd:ro
      - ./site:/usr/share/nginx/html:ro
      - ./server/server.crt:/etc/nginx/ssl/server.crt:ro
      - ./server/server.key:/etc/nginx/ssl/server.key:ro
    restart: always

  mkdocs:
    build: .
    container_name: mkdocs_dev
    volumes:
      - ./:/docs
    ports:
      - "8000:8000"
    command: serve --dev-addr=0.0.0.0:8000 --livereload
    restart: always
    depends_on:
      - kroki

  zensical:
    build:
      context: .
      dockerfile: Dockerfile.zensical
    container_name: zensical_dev
    volumes:
      - ./:/docs
    ports:
      - "8001:8000"
    command: serve --dev-addr=0.0.0.0:8000
    restart: always
    depends_on:
      - kroki

  kroki:
    image: yuzutech/kroki:latest
    container_name: kroki_server
    expose:
      - "8000"
    environment:
      - KROKI_PLANTUML_ENABLED=true
    restart: always
