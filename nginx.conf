server {
    listen 80;
    server_name localhost;

    # すべてのアクセスに対してBasic認証を要求
    auth_basic "Restricted Access - Dev Docs";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # コンテナ内にマウントしたsiteディレクトリのパス
    root /usr/share/nginx/html;
    index index.html;

    # MkDocsの「use_directory_urls (デフォルトtrue)」に対応するための設定
    location / {
        try_files $uri $uri/ =404;
    }

    # 404エラーページのカスタマイズ（MkDocsが生成した404ページを使用）
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # キャッシュ設定（静的アセットのパフォーマンス向上）
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # location / {
    #     # 認証に成功したらMkDocsコンテナへ通信を流す
    #     proxy_pass http://mkdocs:8000/;
        
    #     # 開発サーバー(Live Reload)のWebSocket通信を通すための設定
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    # }
}